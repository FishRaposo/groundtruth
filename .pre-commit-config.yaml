repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        name: ruff lint
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: python -m pyright apps/api/app
        language: system
        files: ^apps/api/
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm --prefix apps/web run lint
        language: system
        files: ^apps/web/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
