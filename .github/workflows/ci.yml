name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      integration:
        description: Run offline contracts with PostgreSQL and Redis extras installed
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      integration:
        description: Run offline contracts with PostgreSQL and Redis extras installed
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17" # keep in step with apps/api/Dockerfile and [tool.uv]
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install self-contained API checks from the lockfile
        run: |
          uv sync --project apps/api --locked --extra dev --extra postgres --extra redis --python 3.11
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - name: API unit tests
        run: >-
          python -m pytest apps/api/tests -q
          --ignore=apps/api/tests/integration
          --basetemp=.pytest-temp-ci-unit
      - name: Script contract tests
        run: >-
          python -m pytest scripts/tests -q
          --basetemp=.pytest-temp-ci-scripts
      - name: Ruff lint
        run: python -m ruff check apps/api/app apps/api/tests examples scripts
      - name: Ruff format
        run: python -m ruff format --check apps/api/app apps/api/tests examples scripts
      - name: Pyright
        run: python -m pyright apps/api/app
      - name: Reject external shared-core dependencies
        run: python scripts/check_forbidden_dependencies.py
      - name: Verify deterministic portfolio evidence
        run: |
          python scripts/portfolio_demo.py
          python scripts/verify_portfolio_evidence.py
      - name: Verify recorded connected-evidence bundle integrity
        # e19006c is the recorded source revision the historical bundle is bound to;
        # integrity verification asserts the recorded first quality gate stays FAILED.
        run: python scripts/verify_connected_evidence.py --source-revision e19006c

  backend-package:
    name: Backend Package (self-contained wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17" # keep in step with apps/api/Dockerfile and [tool.uv]
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install package verification tools from the lockfile
        run: |
          uv sync --project apps/api --locked --extra dev --python 3.11
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_forbidden_dependencies.py
      - run: python -m build apps/api
      - run: python scripts/check_wheel_contents.py
      - name: Export locked runtime versions as pip constraints
        run: >-
          uv export --project apps/api --locked --no-dev --no-emit-project
          --no-hashes --format requirements-txt
          --output-file "$RUNNER_TEMP/constraints.txt"
      - name: Install the wheel in a clean venv (locked versions)
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        run: python scripts/verify_isolated_wheel.py

  backend-integration:
    name: Backend Test (optional dependency contracts)
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
      && inputs.integration == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17" # keep in step with apps/api/Dockerfile and [tool.uv]
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install self-contained API checks from the lockfile
        run: |
          uv sync --locked --extra dev --extra postgres --extra redis --python 3.11
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pytest tests/integration -q

  backend-infrastructure:
    name: PostgreSQL pgvector and Redis contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundtruth_portfolio
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: groundtruth_portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundtruth_portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PYTHONPATH: apps/api
      GROUNDTRUTH_INFRASTRUCTURE_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://groundtruth_portfolio:local-ci-only@127.0.0.1:5432/groundtruth_portfolio
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_URL: redis://127.0.0.1:6379/0
      EMBEDDING_MODE: deterministic
      EMBEDDING_DIMENSIONS: "384"
      GENERATION_MODE: extractive
      INGESTION_MODE: queued
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17" # keep in step with apps/api/Dockerfile and [tool.uv]
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install infrastructure extras from the lockfile
        run: |
          uv sync --project apps/api --locked --extra dev --extra postgres --extra redis --python 3.11
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m app.db.migrate
      - run: python -m pytest apps/api/tests/infrastructure -q -p no:cacheprovider

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  frontend-browser:
    name: Frontend Browser (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:chromium

  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t groundtruth-api ./apps/api
      - name: Build Web image
        run: docker build -t groundtruth-web ./apps/web

  connected-live:
    name: Connected Live (real portable application)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17" # keep in step with apps/api/Dockerfile and [tool.uv]
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install API with locked local-model extras and CPU torch
        run: |
          uv sync --project apps/api --locked --extra dev --python 3.11
          uv export --project apps/api --locked --extra embeddings --extra reader --extra support --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/reader-constraints.txt"
          uv pip install --python apps/api/.venv/bin/python --torch-backend cpu --constraint "$RUNNER_TEMP/reader-constraints.txt" --editable "apps/api[embeddings,reader,support]"
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - name: Download pinned local models
        run: |
          python -m app.model_setup --directory .tmp/models/minilm
          python -m app.reader_setup --directory .tmp/models/reader-roberta --model roberta
          python -m app.support_setup --directory .tmp/models/support
      - name: Verify the real connected workflow over HTTP (default corpus)
        run: |
          python scripts/portfolio_local.py migrate --data-dir .tmp/portfolio-ci-verify
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci-verify --answer-selection lexical \
            > .tmp/portfolio-ci-verify/api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci-verify/api.log; exit 1; }
            sleep 2
          done
          python scripts/portfolio_local.py seed --data-dir .tmp/portfolio-ci-verify \
            --answer-selection lexical
          python scripts/verify_connected_workflow.py \
            --seed-manifest .tmp/portfolio-ci-verify/seed-manifest.json \
            --output .tmp/portfolio-ci-verify/workflow-before.json
          pkill -f "app.main:app" || true
          sleep 2
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci-verify --answer-selection lexical \
            > .tmp/portfolio-ci-verify/api-restart.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci-verify/api-restart.log; exit 1; }
            sleep 2
          done
          python scripts/verify_connected_workflow.py \
            --seed-manifest .tmp/portfolio-ci-verify/seed-manifest.json \
            --output .tmp/portfolio-ci-verify/workflow-after.json \
            --restart-check .tmp/portfolio-ci-verify/workflow-before.json
          pkill -f "app.main:app" || true
      - name: Seed the reader-verified browser corpus and record a reader-error row
        # Explicit development engineering settings; this job does not certify
        # the separately frozen synthetic blind quality gate or select defaults.
        run: |
          python scripts/portfolio_local.py migrate --data-dir .tmp/portfolio-ci
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci --answer-selection reader \
            --answer-proposal-profile qa_only_v1 \
            --reader-model roberta --reader-dir .tmp/models/reader-roberta \
            --reader-threshold 8 --answer-support local_nli \
            --support-dir .tmp/models/support --support-margin 0 \
            > .tmp/portfolio-ci/api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci/api.log; exit 1; }
            sleep 2
          done
          python scripts/portfolio_local.py seed --data-dir .tmp/portfolio-ci \
            --answer-selection reader \
            --corpus-dir apps/api/app/portfolio/assets/coverage-development
          pkill -f "app.main:app" || true
          sleep 2
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci --answer-selection reader \
            --answer-proposal-profile qa_only_v1 \
            --reader-model roberta --reader-threshold 8 \
            --answer-support local_nli --support-dir .tmp/models/support --support-margin 0 \
            --reader-dir .tmp/models/missing-reader \
            > .tmp/portfolio-ci/api-reader-error.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci/api-reader-error.log; exit 1; }
            sleep 2
          done
          python - <<'EOF'
          import json, httpx
          path = ".tmp/portfolio-ci/seed-manifest.json"
          manifest = json.load(open(path))
          headers = {"X-API-Key": manifest["principals"]["admin-a"]["api_key"]}
          response = httpx.post(manifest["api_url"] + "/api/queries", headers=headers,
              json={"question": "Who authorizes the deployment?", "retrieval_method": "keyword"}, timeout=120)
          assert response.status_code == 503, f"Missing reader must return503, got{response.status_code}"
          identifier = response.json()["detail"]["query_id"]
          saved = httpx.get(manifest["api_url"] + "/api/queries/" + identifier, headers=headers, timeout=30)
          saved.raise_for_status()
          record = saved.json()
          assert record["outcome"] == "error" and record["answer"] is None and not record["refused"]
          assert record["provenance"]["answer_selection"]["readiness"] == "error"
          manifest["reader_error_query_id"] = identifier
          json.dump(manifest, open(path, "w"), indent=2)
          EOF
          pkill -f "app.main:app" || true
          sleep 2
          mkdir -p .tmp/models/missing-support
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci --answer-selection reader \
            --answer-proposal-profile qa_only_v1 \
            --reader-model roberta --reader-dir .tmp/models/reader-roberta \
            --reader-threshold 8 --answer-support local_nli \
            --support-dir .tmp/models/missing-support --support-margin 0 \
            > .tmp/portfolio-ci/api-support-error.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci/api-support-error.log; exit 1; }
            sleep 2
          done
          python - <<'EOF'
          import json, httpx
          path = ".tmp/portfolio-ci/seed-manifest.json"
          manifest = json.load(open(path))
          headers = {"X-API-Key": manifest["principals"]["admin-a"]["api_key"]}
          response = httpx.post(manifest["api_url"] + "/api/queries", headers=headers,
              json={"question": "Who authorizes the deployment?", "retrieval_method": "keyword"}, timeout=120)
          assert response.status_code == 503, f"Missing support model must return503, got{response.status_code}"
          identifier = response.json()["detail"]["query_id"]
          saved = httpx.get(manifest["api_url"] + "/api/queries/" + identifier, headers=headers, timeout=30)
          saved.raise_for_status()
          record = saved.json()
          assert record["outcome"] == "error" and record["answer"] is None and not record["refused"]
          support = record["provenance"]["answer_selection"]["evidence_support"]
          assert support["mode"] == "local_nli" and support["readiness"] == "error"
          manifest["support_error_query_id"] = identifier
          json.dump(manifest, open(path, "w"), indent=2)
          EOF
          pkill -f "app.main:app" || true
          sleep 2
          nohup python scripts/portfolio_local.py serve \
            --data-dir .tmp/portfolio-ci --answer-selection reader \
            --answer-proposal-profile qa_only_v1 \
            --reader-model roberta --reader-dir .tmp/models/reader-roberta \
            --reader-threshold 8 --answer-support local_nli \
            --support-dir .tmp/models/support --support-margin 0 \
            > .tmp/portfolio-ci/api-final.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8400/api/health > /dev/null && break
            [ "$i" = 90 ] && { cat .tmp/portfolio-ci/api-final.log; exit 1; }
            sleep 2
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build the production frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8400
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Connected browser suite against the real API
        working-directory: apps/web
        env:
          GROUNDTRUTH_SEED_MANIFEST: ${{ github.workspace }}/.tmp/portfolio-ci/seed-manifest.json
        run: npm run test:e2e:live
      - name: Diagnostic reader browser evidence (supplemental)
        working-directory: apps/web
        env:
          GROUNDTRUTH_SEED_MANIFEST: ${{ github.workspace }}/.tmp/portfolio-ci/seed-manifest.json
          GROUNDTRUTH_SCREENSHOTS: ${{ runner.temp }}/diagnostic-screenshots
        run: npx playwright test --config=playwright.diagnostic.config.ts
