name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      integration:
        description: Run offline contracts with PostgreSQL and Redis extras installed
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      integration:
        description: Run offline contracts with PostgreSQL and Redis extras installed
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install self-contained API checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]"
      - name: API unit tests
        run: >-
          python -m pytest apps/api/tests -q
          --ignore=apps/api/tests/integration
          --basetemp=.pytest-temp/ci-unit
      - name: Ruff lint
        run: python -m ruff check apps/api/app apps/api/tests examples scripts
      - name: Ruff format
        run: python -m ruff format --check apps/api/app apps/api/tests examples scripts
      - name: Pyright
        run: python -m pyright apps/api/app
      - name: Reject external shared-core dependencies
        run: python scripts/check_forbidden_dependencies.py
      - name: Verify deterministic portfolio evidence
        run: |
          python scripts/portfolio_demo.py
          python scripts/verify_portfolio_evidence.py

  backend-package:
    name: Backend Package (self-contained wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - run: python scripts/check_forbidden_dependencies.py
      - run: python -m build apps/api
      - run: python scripts/check_wheel_contents.py
      - run: python scripts/verify_isolated_wheel.py

  backend-integration:
    name: Backend Test (optional dependency contracts)
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
      && inputs.integration == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install self-contained API checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,redis]"
      - run: python -m pytest tests/integration -q

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  frontend-browser:
    name: Frontend Browser (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:chromium

  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t groundtruth-api ./apps/api
      - name: Build Web image
        run: docker build -t groundtruth-web ./apps/web
