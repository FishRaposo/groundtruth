name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run PostgreSQL and Redis integration tests
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install self-contained API checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]"
      - run: ruff check apps/api/app apps/api/tests
      - run: ruff format --check apps/api/app apps/api/tests

  backend-test:
    name: Backend Test (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install self-contained API checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q --ignore=tests/integration

  backend-package:
    name: Backend Package (self-contained wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - run: python scripts/check_forbidden_dependencies.py
      - run: python -m build apps/api
      - run: python scripts/check_wheel_contents.py
      - run: python scripts/verify_isolated_wheel.py

  backend-integration:
    name: Backend Test (integration)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: groundtruth_test
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://groundtruth:groundtruth_test@localhost:5432/groundtruth_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-ci-dummy-key
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install self-contained API checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,redis]"
      - run: python -m pytest tests/integration -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx next build

  docker-build:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t groundtruth-api ./apps/api
      - name: Build Web image
        run: docker build -t groundtruth-web ./apps/web
