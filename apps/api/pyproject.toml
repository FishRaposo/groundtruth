[project]
name = "groundtruth"
version = "0.1.0"
description = "Canonical production RAG platform: hybrid search, citations, refusal logic."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "python-multipart>=0.0.6",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "celery>=5.3.0",
    "aiosqlite>=0.19.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# Parsers and model-backed capabilities stay opt-in. The dependency-free
# document, hash-embedding, lexical-reranking, and evaluation paths remain the
# canonical offline demo and CI behavior.
parsers = [
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
]
redis = [
    "redis>=5.0.0",
]
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.3.0",
]
ocr = [
    "pytesseract>=0.3.10",
]
office = [
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pyright>=1.1.0",
    "build>=1.2.0",
    # Current parser contract tests run against these lightweight adapters;
    # production installations can omit the ``parsers`` extra.
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.internal.vendor_core" = ["LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Ruff is configured at the repository root (groundtruth/ruff.toml).
